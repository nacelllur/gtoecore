org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false

# 离线构建：ForgeGradle 启动时会主动连 maven.minecraftforge.net / libraries.minecraft.net
# 做证书校验，无外网时 TLS 握手会无限挂住（实测卡 30 分钟以上不报错）。关掉这项检查。
systemProp.net.minecraftforge.gradle.check.certs=false
systemProp.net.minecraftforge.gradle.check.java=false
systemProp.net.minecraftforge.gradle.check.gradle=false
