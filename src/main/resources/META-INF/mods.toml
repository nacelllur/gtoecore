# 排在 ad_astra 之后加载：使 gtoecore 内置数据包（轨道维度重力覆盖）优先级高于 ad_astra 原版数据
[[dependencies.gtoecore]]
modId="ad_astra"
mandatory=false
versionRange="[1.15,)"
ordering="AFTER"
side="BOTH"

# ⛔ 火箭渲染器覆盖必须「最后一个注册」才不会被盖回去（2026-10-14 实测 override LOST）：
#    ad_astra 的实体渲染器经 resourcefullib → architectury 的 EntityRendererRegistryImpl
#    在 EntityRenderersEvent.RegisterRenderers 里注册，谁最后 put 谁赢。
#    所以除了 ad_astra，还要排在它两个中间层之后，保证我们的事件监听器最后执行。
[[dependencies.gtoecore]]
modId="resourcefullib"
mandatory=false
versionRange="[2.1,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.gtoecore]]
modId="architectury"
mandatory=false
versionRange="[9.2,)"
ordering="AFTER"
side="CLIENT"

# ⛔ 火箭燃料标签真正的对手是 GTNN 的内嵌数据包（data/gtnn/ad_astra.zip）——
#    它也写了 4 个 tier 标签且带 "replace": true（换成 GT 燃料十六烷值柴油/RP-1/肼类）。
#    数据包优先级 = mod 加载顺序（后加载者胜）⇒ 必须排在 gtnn 之后，我们的
#    replace: true 才会赢（2026-10-14 实测：不写这行时被 GTNN 盖回去）。
[[dependencies.gtoecore]]
modId="gtnn"
mandatory=false
versionRange="[1.3,)"
ordering="AFTER"
side="BOTH"
